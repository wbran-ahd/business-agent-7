name: CI

# Pull requests gate the typecheck and the ledger logic checks. Pushes to main
# re-run the same checks so a broken merge is caught on the branch itself; this
# workflow never deploys anything.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new commit on the same PR makes the previous run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # `bun run typecheck` is `tsc -b --noEmit` (tsconfig.app.json covers src,
      # tsconfig.node.json covers vite.config.ts).
      - name: Typecheck
        run: bun run typecheck
      # `bun run test` is `bun scripts/verify-khata.ts` — pure ledger logic
      # checks (amounts, budgets, CSV, formatting) that need no deployment.
      - name: Ledger logic tests
        run: bun run test
